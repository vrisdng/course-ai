name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  deploy-supabase:
    # Deploys edge functions to the linked project. Opt-in: only runs when the
    # SUPABASE_ACCESS_TOKEN secret is configured on the repo, and only on main.
    # Schema migrations are NOT auto-applied here — keep them manual (supabase db
    # push) so schema review stays a deliberate step. See AGENTS.md "Safe modification".
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: supabase
    # Inject the token through the env context so the deploy step can opt out
    # (skip) cleanly when the secret is not configured, rather than failing to link.
    # NOTE: do not reference secrets. directly in an if: expression — the expression
    # parser in this repo rejects it; use the env context instead.
    env:
      SUPABASE_DEPLOY_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy edge functions
        if: ${{ env.SUPABASE_DEPLOY_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_DEPLOY_TOKEN }}
        run: |
          npm install -g supabase@latest
          supabase link --project-ref ksthojmoifnunsatmday
          supabase functions deploy
