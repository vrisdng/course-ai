name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  deploy-supabase:
    # Deploys edge functions to the linked project. Opt-in: only runs when the
    # SUPABASE_ACCESS_TOKEN secret is configured on the repo, and only on main.
    # Schema migrations are NOT auto-applied here — keep them manual (supabase db
    # push) so schema review stays a deliberate step. See AGENTS.md "Safe modification".
    needs: quality
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sS https://websupabase.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          supabase --version

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ksthojmoifnunsatmday

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy
